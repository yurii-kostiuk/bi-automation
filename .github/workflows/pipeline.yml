name: Retail pipeline

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # lets you start it manually from the Actions tab

permissions:
  contents: write          # needed so the job can commit the updated CSV files

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/monthly_kpi.csv data/anomaly_summary.csv data/anomalies.csv data/run_summary.csv
          git diff --staged --quiet || git commit -m "Update pipeline outputs"
          git push
